# Render blueprint for the hosted sales console.
#
# This is the real thing, not the demo: it calls the X Ads API with each rep's own OAuth token, so
# who can get in matters. Three things gate it, and all three have to be set before the first
# sign-in works.
#
#   ALLOWED_HANDLES   The sales handles permitted to sign in. Checked at login *and* on every
#                     request, so removing someone takes effect on their next click rather than
#                     whenever their cookie happens to expire. An empty list denies everyone —
#                     a misconfigured deployment locks itself rather than opening itself.
#
#   SESSION_SECRET    Signs the session cookie. Rotating it signs everyone out, which is the
#                     fastest way to end all sessions at once.
#
#   ENCRYPTION_KEY    Encrypts the stored access tokens. It has to live here rather than on disk:
#                     Render's filesystem is ephemeral, so a generated key file would be replaced
#                     on every deploy and every token already in the database would become
#                     permanently undecryptable. Losing this value has the same effect — everyone
#                     has to reauthorize.
#
# Per-rep OAuth tokens are what keep this safe to share. The app's consumer keys are team-owned, so
# the callback URL is registered once, but each rep authorizes individually and their own advertiser
# grants decide what they can see. Nobody inherits anyone else's access.
services:
  - type: web
    name: x-ads-sales-console
    runtime: node
    plan: starter
    region: oregon
    rootDir: web
    # npm is upgraded first because the version bundled with Node 22.11.0 is 10.9.0, which fails
    # here with "Exit handler never called!" before installing anything (npm/cli#8407, fixed in
    # npm/cli#8429). Pinned to 11 rather than `latest`: npm 12 requires Node >= 22.22.2 and would
    # install successfully, then refuse to run.
    buildCommand: npm i -g npm@11 && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      # Presence of this is what puts the app in hosted multi-rep mode: Postgres-backed, per-user
      # sessions, allowlist enforced. Unset, it is the local single-user tool.
      - key: DATABASE_URL
        fromDatabase:
          name: x-ads-sales-console-db
          property: connectionString

      - key: SESSION_SECRET
        generateValue: true

      # Not generateValue: the app needs exactly 32 bytes, base64. Generate it once with
      #   openssl rand -base64 32
      # and keep a copy somewhere you will not lose it.
      - key: ENCRYPTION_KEY
        sync: false

      # Comma-separated, with or without the @. For example: alice,bob,carol
      - key: ALLOWED_HANDLES
        sync: false

      # The team-owned app from console.x.com. Its allowed callback URLs must include
      # https://<your-service>.onrender.com/api/auth/callback
      - key: X_CONSUMER_KEY
        sync: false
      - key: X_CONSUMER_SECRET
        sync: false

      # Only needed for a custom domain. Left unset, the app uses RENDER_EXTERNAL_URL, which is
      # already the right answer for an onrender.com service.
      - key: APP_ORIGIN
        sync: false

      # The one shared key, deliberately: reps use Grok without each holding an xAI account.
      - key: XAI_API_KEY
        sync: false

databases:
  - name: x-ads-sales-console-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
